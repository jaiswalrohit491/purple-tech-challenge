[project]
name = "store-intelligence"
version = "0.1.0"
description = "Apex Retail Store Intelligence API — CCTV → events → live analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "orjson>=3.10",
]

[project.optional-dependencies]
pipeline = [
    "ultralytics>=8.3",
    "opencv-python-headless>=4.10",
    "shapely>=2.0",
    "numpy>=1.26",
    "torch>=2.4",
    "torchvision>=0.19",
    "anthropic>=0.39",
    "pillow>=10.4",
]
dashboard = [
    "rich>=13.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
