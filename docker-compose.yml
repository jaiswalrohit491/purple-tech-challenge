services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 2s
      timeout: 3s
      retries: 30
    # No host port binding: API talks to the DB on the internal docker network.

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://apex:apex@db:5432/apex
      LOG_LEVEL: INFO
      APP_ENV: docker
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data        # rw so pipeline/auto_setup.py can write the staff gallery
      - ./events:/events
    restart: unless-stopped

volumes:
  dbdata:
